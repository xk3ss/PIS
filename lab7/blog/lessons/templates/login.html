<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Вход — Курсы повышения квалификации</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/article.css">
</head>
<body class="article">
    <div class="header">
        <img src="{{ STATIC_URL }}img/logo.png" alt="Курсы повышения квалификации">
        <div class="header-links">
			<a href="{% url 'archive' %}">Все занятия</a>
			<a href="{% url 'register' %}">Регистрация</a>
		</div>
    </div>
    <div class="content">
        <h1>Вход</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ form.username }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Войти">
        </form>
        {{ form.errors }}
        <p><a href="{% url 'register' %}" style="color:#fff;">Нет аккаунта? Зарегистрироваться</a></p>
    </div>
</body>
</html>
