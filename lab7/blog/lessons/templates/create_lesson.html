<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Добавить занятие — Курсы повышения квалификации</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/article.css">
</head>
<body class="article">
    <div class="header">
        <img src="{{ STATIC_URL }}img/logo.png" alt="Курсы повышения квалификации">
        <div class="header-links">
			<a href="{% url 'archive' %}">Все занятия</a>
			<a href="{% url 'logout' %}">Выйти</a>
		</div>
    </div>
    <div class="content">
        <h1>Добавить занятие</h1>
        <form method="POST">
            {% csrf_token %}

            <label>Преподаватель:</label>
            <select name="teacher">
                {% for t in teachers %}<option value="{{ t.id }}">{{ t }}</option>{% endfor %}
            </select>

            <label>Группа:</label>
            <select name="group">
                {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
            </select>

            <label>Предмет:</label>
            <select name="subject">
                {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
            </select>

            <label>Вид занятия:</label>
            <select name="lesson_type">
                {% for lt in lesson_types %}<option value="{{ lt.id }}">{{ lt.name }}</option>{% endfor %}
            </select>

            <input type="text" name="hours" placeholder="Часов" value="{{ form.hours }}">
            <input type="text" name="rate_per_hour" placeholder="Оплата за 1 час" value="{{ form.rate_per_hour }}">
            <input type="submit" value="Сохранить">
        </form>
        {{ form.errors }}
    </div>
</body>
</html>
