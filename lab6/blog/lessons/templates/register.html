<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Регистрация — Курсы повышения квалификации</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/article.css">
</head>
<body class="article">
    <div class="header">
        <img src="{{ STATIC_URL }}img/logo.png" alt="Курсы повышения квалификации">
        <div class="header-links">
			<a href="{% url 'archive' %}">Все занятия</a>
			<a href="{% url 'login' %}">Войти</a>
		</div>
    </div>
    <div class="content">
        <h1>Регистрация</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ form.username }}">
            <input type="text" name="email" placeholder="Email" value="{{ form.email }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Зарегистрироваться">
        </form>
        {{ form.errors }}
        <p><a href="{% url 'login' %}" style="color:#fff;">Уже есть аккаунт? Войти</a></p>
    </div>
</body>
</html>
